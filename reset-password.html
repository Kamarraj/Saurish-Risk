<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Saurish Risk</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldHover: '#B59328',
              dark: '#030712',
              card: '#0B0F19',
              border: '#1F293D'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at center, #0a1329 0%, #030712 100%);
    }
  </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden">

  <!-- TOP NAVIGATION HEADER -->
  <header class="w-full p-6 flex justify-between items-center max-w-7xl mx-auto z-10">
    <a href="index.html" class="flex items-center gap-3">
      <img src="images/logo.png" alt="Saurish Risk Logo" class="h-9 w-auto object-contain">
      <span class="text-base font-bold tracking-wider text-white">SAURISH <span class="text-brand-gold">RISK</span></span>
    </a>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex items-center justify-center p-4 z-10">
    <div class="w-full max-w-md bg-brand-card/90 backdrop-blur-md border border-brand-border rounded-2xl p-8 shadow-2xl space-y-6">
      
      <div class="text-center space-y-2">
        <h2 class="text-xl font-bold text-white">🔑 Set New Password</h2>
        <p class="text-xs text-slate-400">Account email: <span id="display-email" class="text-brand-gold font-bold"></span></p>
      </div>

      <!-- STATUS ALERT MESSAGE -->
      <div id="alert-message" class="hidden text-xs p-3 rounded-xl text-center font-semibold"></div>

      <!-- RESET PASSWORD FORM -->
      <form id="reset-form" onsubmit="handleResetSubmit(event)" class="space-y-4">
        
        <!-- NEW PASSWORD FIELD -->
        <div class="space-y-1 relative">
          <label class="block text-xs font-semibold text-slate-400">New Password</label>
          <div class="relative">
            <input type="password" id="input-new-password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-brand-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-gold transition pr-10">
            <button type="button" onclick="toggleVisibility('input-new-password')" class="absolute right-3 top-3 text-slate-500 hover:text-slate-300 text-xs font-semibold">👁️</button>
          </div>
        </div>

        <!-- CONFIRM NEW PASSWORD FIELD -->
        <div class="space-y-1 relative">
          <label class="block text-xs font-semibold text-slate-400">Confirm New Password</label>
          <div class="relative">
            <input type="password" id="input-confirm-password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-brand-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-gold transition pr-10">
            <button type="button" onclick="toggleVisibility('input-confirm-password')" class="absolute right-3 top-3 text-slate-500 hover:text-slate-300 text-xs font-semibold">👁️</button>
          </div>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" id="btn-submit" class="w-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-sm py-3.5 rounded-xl transition shadow-lg shadow-brand-gold/10 mt-2">
          Update Password
        </button>
      </form>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full p-4 text-center text-[10px] text-slate-600 z-10">
    © 2026 SAURISH RISK. All rights reserved.
  </footer>

  <!-- SCRIPT -->
  <script>
    let userEmail = '';

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      userEmail = urlParams.get('email');

      if (userEmail) {
        document.getElementById('display-email').innerText = userEmail;
      } else {
        showAlert('Invalid password reset link.', false);
        document.getElementById('reset-form').classList.add('hidden');
      }
    });

    function toggleVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function showAlert(message, isSuccess) {
      const alertMsg = document.getElementById('alert-message');
      alertMsg.innerText = message;
      alertMsg.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 'bg-rose-500/10', 'text-rose-400', 'border-rose-500/20');

      if (isSuccess) {
        alertMsg.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
      } else {
        alertMsg.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/20');
      }
    }

    function handleResetSubmit(event) {
      event.preventDefault();

      const newPassword = document.getElementById('input-new-password').value;
      const confirmPassword = document.getElementById('input-confirm-password').value;

      if (newPassword.length < 6) {
        showAlert('Password must be at least 6 characters long.', false);
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert('Password and Confirm Password do not match!', false);
        return;
      }

      // Update Local Storage Data
      let storedUser = JSON.parse(localStorage.getItem('saurish_user')) || {};
      
      if (storedUser.email === userEmail) {
        storedUser.password = newPassword;
        localStorage.setItem('saurish_user', JSON.stringify(storedUser));
      } else {
        // Fallback for new user session
        localStorage.setItem('saurish_user', JSON.stringify({ email: userEmail, password: newPassword, plan: 'basic' }));
      }

      showAlert('✅ Password reset successful! Redirecting to login...', true);

      setTimeout(() => {
        window.location.href = 'login.html?action=login';
      }, 1500);
    }
  </script>
</body>
</html>
